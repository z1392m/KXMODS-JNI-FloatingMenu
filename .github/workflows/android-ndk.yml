name: Build KXMODS Android JNI libraries

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure ${{ matrix.abi }}
        run: |
          cmake -S app/src/main/cpp -B "build/${{ matrix.abi }}" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/output/${{ matrix.abi }}"

      - name: Compile shared library
        run: cmake --build "build/${{ matrix.abi }}" --config Release --parallel 2

      - name: Verify output
        run: |
          test -f "output/${{ matrix.abi }}/libKXModsMenu.so"
          file "output/${{ matrix.abi }}/libKXModsMenu.so"

      - name: Upload compiled library
        uses: actions/upload-artifact@v4
        with:
          name: KXMODS-${{ matrix.abi }}
          path: output/${{ matrix.abi }}/libKXModsMenu.so
          if-no-files-found: error
          retention-days: 14
